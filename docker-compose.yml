services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      # Ollama runs natively on the host (Metal acceleration) — see docs/PROGRESS.md.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data

  # Phase 5+: PDF -> TEI parsing. `docker compose --profile phase5 up`.
  grobid:
    image: lfoppiano/grobid:0.8.0
    profiles: ["phase5"]
    ports:
      - "8070:8070"

volumes:
  qdrant_storage:
