[project]
name = "rag"
version = "0.1.0"
description = "Academic citation verification & research-direction discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bibtexparser>=1.4.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "qdrant-client>=1.9",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# Phase 1: embeddings + reranking (heavy — torch backend). Install with `uv sync --extra ml`.
ml = [
    "sentence-transformers>=3.0",
    "transformers>=4.42",
    "torch>=2.3",
]
# Phase 6: clustering limitations into directions.
cluster = [
    "hdbscan>=0.8.33",
]
# Cross-cutting: RAG evaluation metrics.
eval = [
    "ragas>=0.1",
]
# Phase 4+: UI.
ui = [
    "streamlit>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
